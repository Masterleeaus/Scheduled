name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # major-version pin only
      - uses: actions/setup-node@v4 # major-version pin only
        with:
          node-version: 22

      # PHP CLI (8.3) is preinstalled on ubuntu-24.04 runners. The suite calls sodium_* functions, and
      # composer.json also requires ext-curl; this step relies on the runner's PHP build providing both.
      - name: PHP version
        run: php -v

      - name: Central integration PHP unit tests
        run: php tests/run.php

      # Every other PHP test script under tests/ (including tests/pass*/). run.php already includes
      # booking_event_outbox_test.php and booking_owner_cancel_guard_test.php, so they are not run twice.
      # Fixture files are not tests. Any non-zero exit fails the job; nothing is skipped.
      - name: Other PHP test scripts
        # Installer tests need PAYUMONEY_SALT (LegacySqlImporter preflight, #54). This CI-only throwaway value is not the real salt.
        env:
          PAYUMONEY_SALT: ci-only-throwaway-salt
        run: |
          fail=0
          while IFS= read -r f; do
            if ! php "$f" > "$RUNNER_TEMP/test-output.txt" 2>&1; then
              echo "::error file=$f::test script exited non-zero"
              cat "$RUNNER_TEMP/test-output.txt"
              fail=1
            fi
          done < <(find tests -name '*.php' ! -path '*fixture*' ! -name run.php \
            ! -name booking_event_outbox_test.php ! -name booking_owner_cancel_guard_test.php | sort)
          exit "$fail"

      # Dependencies come only from the committed lockfile (scheduled/package-lock.json).
      - name: Install locked Central link package dependencies
        working-directory: scheduled
        run: npm ci

      - name: Node module syntax check
        working-directory: scheduled
        run: npm run check

      - name: Central link Node tests
        working-directory: scheduled
        run: npm test

      # Preflight is a readiness report. The example/unconfigured tree is NOT ready, and three
      # manual-verification checks are always reported as not passed, so exit 1 is the only
      # expected result here. Any other exit code or invalid JSON fails.
      - name: Preflight check mode (JSON readiness report)
        run: |
          set +e
          php scripts/preflight.php --json > "$RUNNER_TEMP/preflight.json"
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "preflight exited $rc; expected 1"
            cat "$RUNNER_TEMP/preflight.json"
            exit 1
          fi
          php -r '$j=json_decode(file_get_contents($argv[1]),true); if(!is_array($j)||$j["total"]<1){fwrite(STDERR,"preflight JSON invalid\n");exit(1);} $ready=($j["passed"]===$j["total"]); if(($ready?0:1)!==(int)$argv[2]){fwrite(STDERR,"preflight exit code does not match readiness\n");exit(1);}' "$RUNNER_TEMP/preflight.json" "$rc"
