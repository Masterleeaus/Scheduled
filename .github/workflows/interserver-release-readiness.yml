name: InterServer SaaS release readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP runtime
        run: php -v
      - name: Run application verification gates
        shell: bash
        run: |
          set -euo pipefail
          php -v && php tests/run.php
      - name: Write candidate manifest
        if: success()
        shell: bash
        run: |
          printf 'repository=%s\ncommit=%s\nkind=saas\nstatus=validated-candidate-not-deployed\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > RELEASE-MANIFEST.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: saas-readiness-${{ github.sha }}
          path: RELEASE-MANIFEST.txt
          retention-days: 30
