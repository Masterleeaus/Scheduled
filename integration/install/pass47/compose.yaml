name: pa47-install-acceptance
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PA47_HTTP_PORT:-18080}:80"
    volumes:
      - ../../../:/source:ro
      - app_data:/var/www/html
    networks:
      - private
      - egress
    restart: "no"
    security_opt:
      - no-new-privileges:true
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: pa47_fresh_install
      MARIADB_USER: pa47_installer
      MARIADB_PASSWORD: ${PA47_DB_PASSWORD:?Set a unique PA47_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${PA47_ROOT_PASSWORD:?Set a different PA47_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
    tmpfs:
      - /var/lib/mysql:rw,noexec,nosuid,size=512m
    networks:
      - private
    restart: "no"
networks:
  private:
    internal: true
  egress: {}
volumes:
  app_data:
