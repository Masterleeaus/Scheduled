# Include inside the server { } block, BEFORE the generic PHP and location / handlers.
# The application expects document root to be the directory containing index.php.
# Ensure the site's actual Nginx configuration includes these directives.
location ~* ^/(?:core|private|tools|tests|docs|integration|development|scripts|PASS05_EVIDENCE|\.git|\.svn)(?:/|$) { return 403; }
location = /installer/database.sql { return 403; }
# Deny release manifests and engineering evidence at document root.
location ~* ^/(?:PASS[0-9]+(?:_[A-Za-z0-9_-]+)*|RECOVERY_STATUS_PASS[0-9]+)\.(?:json|md)$ { return 403; }
location ~* /(?:\.env(?:\.[^/]*)?|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml(?:\.dist)?|artisan)$ { return 403; }
location ~* \.(?:sql|sqlite|db|bak|backup|log|ini|conf|yml|yaml|dist|md|map)$ { return 403; }
# Restrict execution of PHP scripts to the single public front controller.
location ~ \.php(?:/|$) { return 403; }
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/run/php/php8.1-fpm.sock; # change to your actual PHP-FPM socket
}
